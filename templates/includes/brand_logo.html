{% load static %}
<a href="{% url 'store:home' %}" class="brand-logo" style="display:inline-flex; position:relative; width:min(210px, 45vw); max-width:100%; height:40px; overflow:hidden; flex-shrink:0; align-items:center;" aria-label="DEVIKA CLOTHINGS home">
  {% if store.logo %}
    <img src="{{ store.logo.url }}" alt="DEVIKA CLOTHINGS" width="1300" height="732" decoding="async" class="brand-custom-image" style="display:block; width:100%; height:40px; max-height:40px; object-fit:contain;">
  {% else %}
    <span class="brand-art" style="display:flex; position:relative; align-items:center; gap:10px; width:100%; height:40px; overflow:hidden;" aria-hidden="true">
      <span class="brand-symbol-frame" style="position:relative; display:block; overflow:hidden; flex:0 0 30px; height:32.24px;"><img src="{% static 'images/logo/devika-clothings-transparent.png' %}" alt="" width="1672" height="941" decoding="async" class="brand-leaf" style="position:absolute; width:249.552%; max-width:none; height:auto; left:-80%; top:-5.556%;"></span>
      <span class="brand-wordmark-frame" style="position:relative; display:block; overflow:hidden; flex:1; aspect-ratio:1090 / 90;"><img src="{% static 'images/logo/devika-clothings-transparent.png' %}" alt="" width="1672" height="941" decoding="async" class="brand-wordmark" style="position:absolute; width:153.395%; max-width:none; height:auto; left:-26.606%; top:-888.889%;"></span>
    </span>
  {% endif %}
  <span class="brand-logo-fallback" hidden>DEVIKA CLOTHINGS</span>
</a>
