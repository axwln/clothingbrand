{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=20261026-logo-layout-3">
</head>
<body class="bg-espresso min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      {% include "includes/brand_logo.html" %}
      <a href="{% url 'store:home' %}" class="block text-sm text-ivory mt-3">Home</a>
    </div>
    <h1 class="font-serif text-3xl text-ivory text-center mb-8">Dashboard</h1>
    {% if error %}
      <div class="mb-4 px-4 py-3 border border-red-400/50 bg-red-900/20 text-red-300 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs tracking-widest uppercase text-ivory/50 mb-1">Username</label>
        <input type="text" name="username" required autofocus
               class="w-full bg-ivory/10 border border-ivory/20 text-ivory px-4 py-3 text-sm focus:outline-none focus:border-taupe">
      </div>
      <div>
        <label class="block text-xs tracking-widest uppercase text-ivory/50 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full bg-ivory/10 border border-ivory/20 text-ivory px-4 py-3 text-sm focus:outline-none focus:border-taupe">
      </div>
      <button type="submit" class="w-full bg-taupe text-ivory py-3 text-xs tracking-widest uppercase hover:bg-taupe/80 transition-colors">
        Sign In
      </button>
    </form>
  </div>
</body>
</html>
