{% extends "dashboard/base_dashboard.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="max-w-sm">
  <div class="bg-white border border-sand p-6">
    <p class="text-sm mb-4">Are you sure you want to delete/archive <strong>{{ object }}</strong>?</p>
    <form method="post" class="flex gap-3">
      {% csrf_token %}
      <button type="submit" class="btn-primary bg-red-600 hover:bg-red-700">Confirm</button>
      <a href="javascript:history.back()" class="btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
